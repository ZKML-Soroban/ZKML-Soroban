name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pin RISC Zero components to match Cargo.toml (=3.0.6).
  RISC0_VERSION: "3.0.6"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Job name must stay `test`: it is the required status check on main.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV (Rust 1.91)
    # Cargo.toml declares rust-version = "1.91", the floor soroban-sdk 27 needs.
    # This keeps that claim tested: a dependency bump or a newer language
    # feature that raises the real minimum fails here instead of on a
    # contributor's machine. `+1.91` is needed because rust-toolchain.toml
    # pins stable, and the toolchain file wins over `rustup default`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.91 check --workspace --all-targets
      - run: cargo +1.91 check -p zkml-verifier --target wasm32v1-none --profile contract

  no_std:
    name: zkml-common without std feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p zkml-common --no-default-features

  cross-platform:
    name: Tests on ${{ matrix.os }}
    # Everything that does not need the RISC Zero toolchain must work on the
    # three platforms contributors actually use. This job is what would have
    # caught the Windows stack overflow in the Poseidon path.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  contract:
    name: Verifier WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build contract
        run: cargo build -p zkml-verifier --target wasm32v1-none --profile contract
      - name: Report size
        run: ls -l target/wasm32v1-none/contract/zkml_verifier.wasm
      - name: Measure on-chain cost on the compiled WASM
        # The docs quote these figures, so the test fails if either entry point
        # moves above the documented ceiling. See `test_wasm_budget` in lib.rs.
        run: cargo test -p zkml-verifier wasm_budget -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: zkml_verifier.wasm
          path: target/wasm32v1-none/contract/zkml_verifier.wasm

  zkvm:
    name: zkVM guest on ${{ matrix.os }} (dev mode)
    # RISC Zero supports Linux and macOS, and the docs make claims about both.
    # Running the toolchain on each means those claims are tested rather than
    # inferred, and macOS is where they were weakest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install RISC Zero toolchain
        # rzup resolves the release through the GitHub API. Unauthenticated,
        # that shares a rate limit with every other runner on the same egress
        # IP, and the macOS pool hits it. The job token lifts the limit; it
        # needs no permission beyond reading a public release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero "${RISC0_VERSION}"
          rzup install r0vm "${RISC0_VERSION}"
          rzup install rust
      - name: Test zkVM guest
        env:
          RISC0_DEV_MODE: "1"
        run: cargo test -p zkml-prover --features zkvm
      - name: Cross-check the RISC Zero digest arithmetic
        env:
          RISC0_DEV_MODE: "1"
        run: cargo test -p zkml-prover --features zkvm --test risc0_digests
      - name: Test the Groth16 surface (no real proving)
        env:
          RISC0_DEV_MODE: "1"
        run: cargo test -p zkml-prover --features groth16
      - name: Check that the Metal feature compiles on Apple Silicon
        if: runner.os == 'macOS'
        run: cargo check -p zkml-prover --features metal
      - name: Clippy with the zkVM and Groth16 features
        # The Clippy job builds default features only, so code behind `zkvm`
        # and `groth16` was never linted there. It needs the RISC Zero
        # toolchain to build the guest, which this job already installs.
        if: runner.os == 'Linux'
        run: cargo clippy -p zkml-prover --features groth16 --all-targets -- -D warnings

  groth16:
    name: Groth16 compression (manual)
    # Real compression takes minutes and needs Docker, so it does not run on
    # every push. Trigger it from the Actions tab before a release or after
    # bumping the RISC Zero version.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install RISC Zero toolchain
        # rzup resolves the release through the GitHub API. Unauthenticated,
        # that shares a rate limit with every other runner on the same egress
        # IP, and the macOS pool hits it. The job token lifts the limit; it
        # needs no permission beyond reading a public release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero "${RISC0_VERSION}"
          rzup install r0vm "${RISC0_VERSION}"
          rzup install rust
      - name: Prove and verify a real Groth16 bundle
        env:
          RISC0_DEV_MODE: "0"
        run: |
          cargo test -p zkml-prover --features groth16 --test groth16_bundle \
            real_groth16 -- --ignored --nocapture

  audit:
    name: Dependency audit
    # Fails on any RustSec vulnerability in either lockfile. Unmaintained and
    # other informational advisories are reported but do not fail the job.
    #
    # Every ignore below has no semver-compatible fix, so `cargo update` cannot
    # clear it, and none of them reaches the deployed contract WASM or
    # zkml-common. Most arrive through RISC Zero 3.0.6 (pinned with `=` in
    # Cargo.toml); RUSTSEC-2026-0387 arrives through soroban-sdk's native test
    # host. Drop an ignore as soon as an upstream bump clears it, so the list
    # never hides a new advisory in the same crate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit the workspace lockfile
        # RUSTSEC-2023-0071  rsa: Marvin timing attack, no fixed release.
        #                    Via risc0-zkvm and risc0-build.
        # RUSTSEC-2026-0344  ruzstd 0.7: fixed in 0.9. Via object 0.36 in risc0-zkvm.
        # RUSTSEC-2026-0367  zip 2.3: fixed in 9.0. Via risc0-circuit-recursion
        # RUSTSEC-2026-0368  and risc0-circuit-keccak.
        # RUSTSEC-2026-0369
        # RUSTSEC-2025-0055  tracing-subscriber 0.2: fixed in 0.3.20. Via
        #                    ark-relations in the Groth16 stack.
        # RUSTSEC-2026-0387  crypto-bigint 0.5: fixed in 0.7.6. Via
        #                    elliptic-curve 0.13 in soroban-env-host, the
        #                    native Soroban host soroban-sdk uses for tests and
        #                    clients. The contract WASM links soroban-env-guest
        #                    instead and does not contain it.
        run: >
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0344
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369
          --ignore RUSTSEC-2025-0055
          --ignore RUSTSEC-2026-0387
      - name: Audit the zkVM guest lockfile
        # RUSTSEC-2026-0220  ruint 1.19: updating the guest lockfile changes the
        #                    image id, so it waits for a golden receipt
        #                    regeneration. Fixed in the workspace lockfile.
        # RUSTSEC-2025-0055  tracing-subscriber 0.2, as above.
        run: >
          cargo audit --file methods/guest/Cargo.lock
          --ignore RUSTSEC-2026-0220
          --ignore RUSTSEC-2025-0055

  docs:
    name: Docs (Mintlify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check broken links
        working-directory: docs
        run: npx --yes mint@latest broken-links
