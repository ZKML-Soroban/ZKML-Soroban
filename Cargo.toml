[workspace]
resolver = "2"
members = [
    "crates/zkml-common",
    "crates/zkml-prover",
    "crates/zkml-verifier",
    "crates/zkml-demo",
]
# methods/ is pulled in as a path dependency when the `zkvm` feature is enabled
# on zkml-prover (keeps default workspace builds free of the RISC Zero toolchain).
# Guest is its own workspace (standard RISC Zero layout).
exclude = ["methods", "methods/guest"]

[workspace.package]
# Single workspace version: every publishable crate is released together.
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Diego Vega <diegosanti2006@hotmail.com>"]
repository = "https://github.com/ZKML-Soroban/ZKML-Soroban"
homepage = "https://github.com/ZKML-Soroban/ZKML-Soroban"
keywords = ["zkml", "zero-knowledge", "stellar", "soroban", "groth16"]

[workspace.dependencies]
# Internal crates. `version` is required for crates.io and must match
# `workspace.package.version`.
zkml-common = { path = "crates/zkml-common", version = "0.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: RISC Zero API changes are a tracked project risk (roadmap).
risc0-zkvm = { version = "=3.0.6" }
risc0-build = { version = "=3.0.6" }

# Size-optimized profile for the Soroban verifier WASM. Kept separate from
# `release` so the off-chain prover is not built with `opt-level = "z"`.
# Build with: cargo build -p zkml-verifier --target wasm32v1-none --profile contract
[profile.contract]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.contract-with-logs]
inherits = "contract"
debug-assertions = true
