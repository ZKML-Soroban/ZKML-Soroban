[package]
name = "zkml-verifier"
description = "On-chain Soroban smart contract for ZK proof verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["cryptography", "wasm", "no-std"]
readme = "README.md"

[lib]
# cdylib: the deployable WASM contract. rlib: lets integrators depend on the
# crate for its types and the generated contract client in tests.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27"

# Shared wire formats and RISC Zero digest arithmetic. no_std and without a
# bundled SHA-256: the contract injects env.crypto().sha256(), which is a host
# function. The prover and the contract must agree byte for byte on the claim
# digest, so they share one implementation rather than two that can drift.
zkml-common = { workspace = true, default-features = false }

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }
