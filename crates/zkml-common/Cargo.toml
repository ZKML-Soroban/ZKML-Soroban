[package]
name = "zkml-common"
description = "Shared types and utilities for the zkml-soroban project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["cryptography", "science"]
documentation = "https://docs.rs/zkml-common"
readme = "README.md"

[features]
default = ["std", "sha2", "poseidon"]
std = []
# Poseidon commitments and the Merkle tree built on them. This pulls in
# light-poseidon and arkworks, whose transitive num-traits does not build for
# `wasm32v1-none`, so the Soroban contract leaves it off and takes only the
# wire formats and the RISC Zero digests.
poseidon = ["dep:light-poseidon", "dep:ark-bn254", "dep:ark-ff"]
# Bundle a SHA-256 implementation for off-chain callers. A Soroban contract
# leaves this off and injects `env.crypto().sha256()` instead, which is a host
# function and far cheaper than the same work compiled into WASM.
sha2 = ["dep:sha2"]

[dependencies]
# `alloc` only: the contract builds this crate for `wasm32v1-none`, where
# serde's std layer does not compile.
serde = { workspace = true, features = ["alloc"] }
light-poseidon = { version = "0.4", optional = true }
ark-bn254 = { version = "0.5", optional = true }
ark-ff = { version = "0.5", optional = true }
# RISC Zero claim digests are SHA-256 based; `default-features = false` keeps
# the guest build free of std.
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.5"
insta = "1.40"
bincode = "1.3"
serde_json = { workspace = true }
