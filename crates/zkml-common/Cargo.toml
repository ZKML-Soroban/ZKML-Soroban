[package]
name = "zkml-common"
description = "Shared types and utilities for the zkml-soroban project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["cryptography", "science"]
documentation = "https://docs.rs/zkml-common"
readme = "README.md"

[features]
default = ["std", "sha2"]
std = []
# Bundle a SHA-256 implementation for off-chain callers. A Soroban contract
# leaves this off and injects `env.crypto().sha256()` instead, which is a host
# function and far cheaper than the same work compiled into WASM.
sha2 = ["dep:sha2"]

[dependencies]
serde = { workspace = true }
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"
# RISC Zero claim digests are SHA-256 based; `default-features = false` keeps
# the guest build free of std.
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.5"
insta = "1.40"
bincode = "1.3"
serde_json = { workspace = true }
