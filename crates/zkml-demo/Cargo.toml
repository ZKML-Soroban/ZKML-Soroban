[package]
name = "zkml-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end demo runner for zkml-soroban (not published)"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
zkml-prover = { path = "../zkml-prover" }
zkml-common = { workspace = true, features = ["std", "poseidon"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
# Reading a submitted transaction's fee from Stellar RPC (`getTransaction`).
# Already in the lockfile through RISC Zero; blocking is enough for one call.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"

[features]
default = []
# Prove in the runner instead of submitting a pre-built `--bundle`.
# Real proving needs x86_64 Linux with Docker; see zkml-prover's manifest.
zkvm = ["zkml-prover/zkvm"]
groth16 = ["zkml-prover/groth16"]
cuda = ["zkml-prover/cuda"]
metal = ["zkml-prover/metal"]
