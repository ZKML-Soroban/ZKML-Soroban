[package]
name = "zkml-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end demo runner for zkml-soroban (not published)"
publish = false

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Workspace dependencies
zkml-prover = { path = "../zkml-prover" }
zkml-verifier = { path = "../zkml-verifier" }
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime for contract interaction
tokio = { version = "1", features = ["full"] }

# Soroban SDK for contract interaction
soroban-sdk = "21"

[features]
default = []
# Enable RISC Zero zkVM features (requires the rzup toolchain)
zkvm = ["zkml-prover/zkvm"]
# Enable Groth16 compression (requires x86_64 Linux with Docker at runtime)
groth16 = ["zkml-prover/groth16"]
