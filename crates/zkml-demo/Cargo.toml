[package]
name = "zkml-demo"
description = "End-to-end demo runner for zkml-soroban KYC scoring"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zkml-demo"
path = "src/main.rs"

[dependencies]
zkml-common = { path = "../zkml-common" }
zkml-prover = { path = "../zkml-prover" }
serde = { workspace = true }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
