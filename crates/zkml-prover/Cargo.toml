[package]
name = "zkml-prover"
description = "Off-chain ML inference and ZK proof generation for zkml-soroban"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Print timing information for inference and proving steps.
timing = []
# RISC Zero guest proving. Enable with `--features zkvm` (requires rzup toolchain).
# CI runs this under RISC0_DEV_MODE=1 in the zkvm job.
zkvm = ["dep:risc0-zkvm", "dep:zkml-methods"]
# STARK to Groth16 compression using local Docker prover.
groth16 = ["zkvm", "dep:risc0-groth16"]
# Bonsai remote proving service for Groth16 generation.
bonsai = ["zkvm", "groth16", "dep:bonsai-sdk", "dep:bincode"]

[dependencies]
zkml-common = { path = "../zkml-common" }
serde = { workspace = true }
serde_json = "1"

# CLI argument parsing. Loose version like serde/soroban-sdk; exact `=` pins are
# reserved for prost/risc0 where API drift is a tracked risk.
clap = { version = "4", features = ["derive"] }

# Phase 1: RISC Zero zkVM (pinned exactly; see docs/proving.md).
risc0-zkvm = { workspace = true, optional = true }
zkml-methods = { path = "../../methods", optional = true }

# STARK to Groth16 compression (pinned exactly; API changes are a tracked risk).
risc0-groth16 = { version = "=3.0.4", optional = true }

# Bonsai proving service for remote Groth16 generation.
bonsai-sdk = { version = "1.1", optional = true }

# Binary serialization for Bonsai receipt handling.
bincode = { version = "1.3", optional = true }

# ONNX protobuf decoding (pinned; API surface used by the importer foundation).
prost = "=0.13.5"
